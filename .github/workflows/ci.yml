name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, skill validation, drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Type check (strict)
        run: mypy
      - name: Validate skill against the Agent Skills spec, policy schema, links and versions
        run: aipg validate --strict
      - name: Generated integrations are up to date
        run: aipg build --check

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  bundled-scripts:
    name: Bundled scripts on Python 3.9 (code-interpreter compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Run the calculators with no third-party packages
        working-directory: skills/ai-product-governance
        run: |
          python scripts/risk_tier.py --validate-policy
          python scripts/risk_tier.py --answers ../../examples/inputs/refund-agent.answers.json --format md
          python scripts/unit_economics.py --input ../../examples/inputs/support-reply-drafting.economics.json --format md

  package:
    name: Build and smoke-test the distribution
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean environment and start the MCP server in-process
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/aipg tier --questions > /dev/null
          /tmp/clean/bin/python -c "from ai_product_governance.mcp_server import build_server; build_server(); print('MCP server OK')"
      - name: Package the skill for upload to skill hosts
        run: |
          python -m pip install -e .
          aipg package --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
